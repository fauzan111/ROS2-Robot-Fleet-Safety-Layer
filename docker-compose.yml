# Gazebo runs headless in the container. Visualise in Foxglove Studio: ws://localhost:8765
services:
  ros:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./ros2_ws/src:/ws/src
      - ./results:/ws/results
      - ./scripts:/ws/scripts
    ports:
      - "8765:8765"
    command: ros2 launch fleet_bringup sim_one_robot.launch.py
