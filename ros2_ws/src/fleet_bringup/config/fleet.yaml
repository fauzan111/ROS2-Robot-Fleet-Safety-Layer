# Three TurtleBot3 waffles in the tb3_sandbox arena: a hexagon about 5 m across with a
# 3x3 grid of pillars at x, y in {-1.1, 0, 1.1}. Gaps between pillars are about 0.65 m and a
# waffle is about 0.3 m wide, so two robots cannot pass each other in the same gap.
#
# robot1 works the west side, robot2 the east side, robot3 crosses north-south through the
# middle, so its path meets both others: that is where near misses and replanning happen.

timeout_s: 120        # wall-clock limit per goal before it is cancelled
near_miss_m: 0.5      # centre-to-centre distance counted as a near miss

robots:
  robot1:
    spawn: {x: -2.0, y: -0.5, yaw: 0.0}
    goals:
      - {name: centre_sw, x: -0.55, y: -0.55, yaw: 0.0}
      - {name: south_west, x: -1.5, y: -1.5, yaw: 3.14}
      - {name: west, x: -2.0, y: 0.5, yaw: 1.57}
      - {name: north_west, x: -1.5, y: 1.5, yaw: 0.0}
      - {name: home, x: -2.0, y: -0.5, yaw: 0.0}
  robot2:
    spawn: {x: 1.8, y: 0.5, yaw: 3.14}
    goals:
      - {name: centre_ne, x: 0.55, y: 0.55, yaw: 3.14}
      - {name: north_east, x: 1.5, y: 1.5, yaw: 0.0}
      - {name: east, x: 1.8, y: -0.5, yaw: -1.57}
      - {name: south_east, x: 1.5, y: -1.5, yaw: 3.14}
      - {name: home, x: 1.8, y: 0.5, yaw: 3.14}
  robot3:
    spawn: {x: 0.0, y: 1.9, yaw: -1.57}
    goals:
      - {name: centre_nw, x: -0.55, y: 0.55, yaw: -1.57}
      - {name: south, x: 0.0, y: -1.9, yaw: 0.0}
      - {name: centre_se, x: 0.55, y: -0.55, yaw: 1.57}
      - {name: home, x: 0.0, y: 1.9, yaw: -1.57}
