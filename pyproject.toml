[project]
name = "ros2-fleet-safety"
version = "0.1.0"
description = "Camera-based safety layer for a ROS 2 / Nav2 robot fleet: person-in-zone stop, OOD slow-down."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "torchvision>=0.19",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ros2_ws"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "ros2_ws/src/fleet_bringup"]
